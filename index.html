<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Library</title>
</head>
<body>
    <button command="show-modal" commandfor="new-book-dialog" class="add-new-btn">Add new book</button>
    <div id="library"></div>
    <dialog id="new-book-dialog">
        <p>This dialog was opened using an invoker command.</p>
        <form action="submit" id="new-book-form">
            <label for="title">Title</label>
            <input type="text" name="title" id="title">
            <label for="author">Author</label>
            <input type="text" name="author" id="author">
            <label for="pages">Number of pages</label>
            <input type="number" name="pages" id="pages">
            <label for="isRead">Read</label>
            <input type="checkbox" name="isRead" id="isRead">
            <button class="add-btn">Add</button>
            <button class="clear-btn">Clear</button>
        </form>
        <button commandfor="new-book-dialog" command="close">Close</button>
    </dialog>
    <script src="./script.js"></script>
</body>
</html>
